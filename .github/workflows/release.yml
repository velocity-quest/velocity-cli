name: Publish management CLI release
on:
  push:
    branches: ['release/cli-v*']
permissions:
  contents: read
jobs:
  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify immutable CI candidate
        run: node scripts/prepare-candidate.mjs
      - run: npm install --prefix "$RUNNER_TEMP/cli-install" --ignore-scripts "$GITHUB_WORKSPACE/release/velocity-quest-cli-$(cat version.txt).tgz"
      - run: node scripts/smoke-install.mjs "$RUNNER_TEMP/cli-install" "$(cat version.txt)"
      - name: Check packed Windows vault deadlines and cancellation
        if: runner.os == 'Windows'
        run: node scripts/check-windows-keychain.mjs "$RUNNER_TEMP/cli-install"
  publish:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/prepare-candidate.mjs
      - name: Publish verified public package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "cli-v$(cat version.txt)" "release/velocity-quest-cli-$(cat version.txt).tgz" "release/velocity-quest-cli-$(cat version.txt).tgz.sha256" --target "$GITHUB_SHA" --title "Velocity CLI $(cat version.txt)" --notes-file release-notes.txt
